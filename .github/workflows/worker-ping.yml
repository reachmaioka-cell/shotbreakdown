name: Worker ping

# Hobby Vercel cron is once a day, which cannot drain the processing queue.
# This pings /api/worker every 5 minutes. Set repository secrets:
#   SITE_URL     e.g. https://shotbreakdown.app
#   CRON_SECRET  same value as the Vercel CRON_SECRET env var
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Drain processing queue
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "SITE_URL and CRON_SECRET secrets are required"
            exit 1
          fi
          curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 280 \
            "${SITE_URL%/}/api/worker"
